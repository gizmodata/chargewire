name: site

# The protocol's site (site/), on pushes to main that touch it or what it is made from (the
# spec, the OpenAPI document, the conformance suite's README and test files), and on every pull
# request: `check` is a required status, so it reports on each one, and runs its steps only
# when the pull request touches those paths (otherwise it succeeds at once).
#   - check: the generated pages (specification, endpoints, conformance) match their sources
#     and every diagram is rendered from its current source; spec/openapi.yaml lints clean
#     (Redocly CLI and openapi-spec-validator); the site builds, which fails on a broken
#     internal link or anchor; lychee checks the external links of the built site.
#   - pages, deploy: on a push or manual run on main, the site is built for GitHub Pages and deployed:
#     the private preview, or, with the repository variable DOCS_GA set to true, the public
#     site at chargewire.gizmodata.com (site/README.md, "Private preview and GA").
#
# The examples on the pages run against real servers with site/scripts/verify_examples.py,
# and the browser checks with site/scripts/screenshots.mjs, locally: they need a built
# reference server, and building DuckDB in CI would cost far more than these checks.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "spec/**"
      - "conformance/README.md"
      - "conformance/tests/test_*.py"
      - ".github/workflows/site.yml"
  # Every pull request (no paths: `check` must report); the job looks at what changed.
  pull_request:
  workflow_dispatch:
    inputs:
      ga:
        description: "Check the public site (deployment on main still uses the DOCS_GA repository variable)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # swagger-ui-dist's install-time analytics, off (site/package.json says so too).
  SCARF_ANALYTICS: "false"
  # The one switch between the private preview and the public site (site/README.md): the
  # repository variable DOCS_GA, or the `ga` input of a run started by hand. With it the build
  # has no preview banner or noindex and sits at the custom domain. The deploy, and the link
  # check's exclusion of the (private until GA) gizmodata repositories, read the variable only.
  DOCS_GA: ${{ (inputs.ga || vars.DOCS_GA == 'true') && 'true' || 'false' }}
  GA_SITE: https://chargewire.gizmodata.com

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its parents
      # A pull request that touches none of the push trigger's paths has nothing to check
      # here; anything else (a push, a manual run, a diff that can't be read) checks all.
      - name: Whether this run has the site to check
        id: scope
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "::warning::could not list the pull request's changes; checking the site"
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          if grep -qE '^(site/|spec/|conformance/README\.md$|conformance/tests/test_[^/]*\.py$|\.github/workflows/site\.yml$)' <<<"$changed"; then
            echo "site=true" >> "$GITHUB_OUTPUT"
          else
            echo "site=false" >> "$GITHUB_OUTPUT"
            echo "Nothing the site is made from changed: the remaining steps are skipped."
          fi
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.site == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.0
        if: steps.scope.outputs.site == 'true'
      - run: npm ci
        if: steps.scope.outputs.site == 'true'
      - name: Generated pages and diagrams match their sources
        if: steps.scope.outputs.site == 'true'
        run: npm run check:generated
      - name: OpenAPI lint
        if: steps.scope.outputs.site == 'true'
        run: ../spec/scripts/lint-openapi.sh
      - name: Build (fails on a broken internal link)
        if: steps.scope.outputs.site == 'true'
        run: npm run build
      - name: The public site (DOCS_GA=true) has nothing of the preview left in it
        if: steps.scope.outputs.site == 'true'
        run: |
          # Proves the switch on every run, before it is flipped: a second build with it on
          # (or this build, when it is on already), checked by scripts/check_ga_build.py.
          if [ "$DOCS_GA" = true ]; then
            out=dist
          else
            out=dist-ga
            DOCS_GA=true DOCS_SITE="$GA_SITE" npm run build -- --outDir "$out"
          fi
          python3 scripts/check_ga_build.py "$out"
      - name: External links
        if: steps.scope.outputs.site == 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          # gizmodata's repositories are internal until GA: an anonymous check gets 404, so
          # their links are left out until the repository variable is flipped; the `ga` input
          # of a dry run doesn't change that.
          # A link to a file of this repository on main is checked against this checkout: on
          # a pull request that adds the file (a new conformance test, which the generated
          # conformance page links) main does not have it yet, and after the merge the
          # checkout is main. A path that is not in the tree still fails.
          workingDirectory: site
          args: --config lychee.toml ${{ vars.DOCS_GA != 'true' && '--exclude ^https://github.com/gizmodata/' || '' }} --remap "^https://github\.com/${{ github.repository }}/(blob|tree)/main/([^#?]*) file://${{ github.workspace }}/\$2" --root-dir ${{ github.workspace }}/site/dist --no-progress "dist/**/*.html"
          fail: true

  pages:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Build for GitHub Pages
        env:
          # The private preview's address, or the custom domain once DOCS_GA is true
          # (site/README.md, "Private preview and GA"); never the manual input here.
          DOCS_GA: ${{ vars.DOCS_GA == 'true' && 'true' || 'false' }}
          DOCS_SITE: ${{ vars.DOCS_GA == 'true' && 'https://chargewire.gizmodata.com' || steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # The pages link to each other from the root (/specification/): the site must be
          # served at the root of its host, as a private preview or a custom domain is.
          if [ -n "$BASE_PATH" ] && [ "$BASE_PATH" != "/" ]; then
            echo "::error::GitHub Pages serves this site under $BASE_PATH; it must be at the root of its host"
            exit 1
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # A deploy is never cut off half way by a newer push; it queues behind it.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
