name: cpp

# The C++ SDK and client library (cpp/): builds them and runs chargewire-client-tests (unit,
# stub-server and live tests against the chargewire-duckdb reference server, which they start),
# chargewire-sdk-tests and chargewire-duckdb-tests (the DuckDB backend in the test process), on
# pull requests and pushes that touch cpp/.
#
# Build the pinned DuckDB source with the binding-transaction recovery patch. Cache
# the install by compiler and recipe so required tests exercise the shipped engine.
# Arrow is built and cached separately.

on:
  pull_request:
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"
  push:
    branches: [main]
    paths:
      - "cpp/**"
      - ".github/workflows/cpp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CC: gcc-14
  CXX: g++-14
  # GCC needs 2 GB and more for some of Beast's and Arrow's files: Ninja's default (one job
  # per CPU, plus two) can run the runner's 16 GB out of memory.
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  CHARGEWIRE_DEPS_DIR: ${{ github.workspace }}/cpp/.deps

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7

      - name: Packages (the compiler, Ninja, OpenSSL 3), retried
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends g++-14 ninja-build libssl-dev; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done
          echo "COMPILER_VERSION=$($CXX -dumpfullversion)" >> "$GITHUB_ENV"
          $CXX --version
          cmake --version

      - name: Patched DuckDB from the cache
        id: duckdb
        uses: actions/cache@v6
        with:
          path: cpp/.deps/duckdb-install
          key: duckdb-${{ runner.os }}-${{ env.CXX }}-${{ env.COMPILER_VERSION }}-${{ hashFiles('cpp/scripts/build-duckdb.sh', 'cpp/scripts/patch-duckdb*.cmake') }}

      - name: Build the pinned DuckDB with transaction recovery
        if: steps.duckdb.outputs.cache-hit != 'true'
        run: ./scripts/build-duckdb.sh

      - name: Arrow from the cache
        id: arrow
        uses: actions/cache@v6
        with:
          path: cpp/.deps/arrow-install
          key: arrow-${{ runner.os }}-${{ env.CXX }}-${{ env.COMPILER_VERSION }}-${{ hashFiles('cpp/scripts/build-arrow.sh') }}

      - name: Arrow (scripts/build-arrow.sh), retried for its downloads
        if: steps.arrow.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if ./scripts/build-arrow.sh; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 15))
          done

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHARGEWIRE_BUILD_TESTS=ON
          cmake --build build

      - name: chargewire-client-tests
        timeout-minutes: 20
        run: ./build/chargewire-client-tests

      - name: chargewire-sdk-tests
        timeout-minutes: 10
        run: ./build/chargewire-sdk-tests

      - name: chargewire-duckdb-tests
        timeout-minutes: 10
        run: ./build/chargewire-duckdb-tests
