[project]
name = "chargewire-conformance"
version = "2.0.0"
description = "Black-box conformance tests for Chargewire servers"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pyarrow>=26.0.0",
  "pytest>=9.1.1",
  "cryptography>=50.0.2",
  "jsonschema>=4.26.0",
  "openapi-spec-validator>=0.9.0",
  "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mtls: starts servers of its own with mutual TLS (needs CHARGEWIRE_TEST_SERVER_BINARY)",
  "own_server: starts a server of its own with other flags (needs CHARGEWIRE_TEST_SERVER_BINARY)",
  "openapi_unchecked: sees responses the OpenAPI document does not describe, on purpose",
  "oauth: starts servers of its own with browser sign-in and a mock identity provider (needs CHARGEWIRE_TEST_SERVER_BINARY)",
]
