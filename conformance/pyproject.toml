[project]
name = "warp-sql-conformance"
version = "0.1.0"
description = "Black-box conformance tests for Warp SQL servers"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "pyarrow>=26.0.0",
  "pytest>=9.1.1",
  "cryptography>=50.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mtls: starts servers of its own with mutual TLS (needs WARP_SQL_TEST_SERVER_BINARY)",
  "own_server: starts a server of its own with other flags (needs WARP_SQL_TEST_SERVER_BINARY)",
]
